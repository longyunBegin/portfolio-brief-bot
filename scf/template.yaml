# 腾讯云 SCF 部署模板（Serverless Framework）
# 部署: sls deploy
# 工作日 10:00 触发（cron 7 位：秒 分 时 日 月 周 年；周 1-5 = 周一至周五）
# SCF Timer 使用北京时间（UTC+8），代码内会再判断是否美股交易日

component: scf
name: portfolio-brief-bot
org: eden

inputs:
  name: portfolio-brief-bot
  src:
    src: ./
    exclude:
      - .env
      - .env.example
      - .ibkr_refresh_token
      - node_modules/**
      - .git/**
      - .codeartsdoer/**
      - preview.html
      - scf/**
  handler: src/index.scfHandler
  runtime: Nodejs18.15
  memorySize: 256
  timeout: 60
  region: ap-guangzhou
  description: 持仓股收盘涨跌定时邮件通知
  environment:
    variables:
      BROKER_USE_MOCK: 'false'
      IBKR_CLIENT_ID: '80565d78-3d32-42d0-a881-f49ae161cf20'
      # 以下敏感变量请在 SCF 控制台单独配置，避免入库：
      # IBKR_REFRESH_TOKEN（初始值，后续由 COS 接管 rotation）
      # COS_SECRET_ID / COS_SECRET_KEY / COS_BUCKET（持久化 refresh_token）
      # SMTP_HOST / SMTP_PORT / SMTP_SECURE / SMTP_USER / SMTP_PASS / MAIL_FROM / MAIL_TO
      COS_REGION: 'ap-guangzhou'
      COS_KEY: 'ibkr_refresh_token'
      TRADE_DAY_ONLY: 'true'
      NOTIFY_HOUR: '10'
      NOTIFY_MINUTE: '0'
  events:
    - timer:
        parameters:
          name: dailyWorkday10am
# 每天触发，代码内判断昨日是否美股交易日（周六推送周五数据，周一/周日跳过）
          cronExpression: '0 0 10 * * * *'
          enable: true
          payload: ''
